[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audio-intelligence-mcp"
version = "0.1.1"
description = "Local-first Audio Intelligence MCP server"
readme = "README.md"
keywords = ["mcp", "audio", "speech-to-text", "diarization", "sound-event-detection", "whisper"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sanjay Sakhinala" }]
dependencies = [
  "mcp>=1.9,<2",
  "pydantic>=2",
  "pydantic-settings>=2",
  "numpy",
  "scipy",
  "soundfile",
  "platformdirs",
  "httpx",
]

[project.optional-dependencies]
models = [
  "faster-whisper",
  "silero-vad",
  "panns-inference",
  "torch",
  "librosa",
  "speechbrain",
  "sentence-transformers",
]
pyannote = ["pyannote.audio"]
llm = ["anthropic>=1.15"]
dev = ["pytest", "pytest-asyncio", "jiwer", "psutil", "pyttsx3"]

[project.urls]
Homepage = "https://github.com/DNSdecoded/audio-intelligence-mcp"
Documentation = "https://github.com/DNSdecoded/audio-intelligence-mcp/blob/main/docs/tools.md"
Issues = "https://github.com/DNSdecoded/audio-intelligence-mcp/issues"

[project.scripts]
audio-mcp = "audio_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "slow: uses real models (downloads on first run)",
  "long: long-running test",
]
